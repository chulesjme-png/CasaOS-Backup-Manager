<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programaciones - CasaOS Backup Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🚀 CasaOS Backup Manager</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                <a class="nav-link active" href="/schedules"><i class="bi bi-calendar-check me-1"></i> Programaciones</a>
                <a class="nav-link" href="/restore"><i class="bi bi-arrow-counterclockwise me-1"></i> Restauración</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Tareas Programadas</h3>
                <p class="text-muted mb-0">Gestiona la automatización de tus copias de seguridad.</p>
            </div>
            <button class="btn btn-primary" onclick="alert('Función de agregar tarea vía API')">
                <i class="bi bi-plus-lg me-1"></i> Nueva Programación
            </button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nombre</th>
                            <th>Frecuencia (Cron)</th>
                            <th>Última Ejecución</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="schedules-list">
                        <tr>
                            <td colspan="5" class="text-center py-4 text-muted">Cargando tareas...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadSchedules() {
            try {
                const res = await fetch('/api/schedules/');
                const tableBody = document.getElementById('schedules-list');
                if (res.ok) {
                    const schedules = await res.json();
                    if (schedules.length === 0) {
                        tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No hay programaciones registradas.</td></tr>`;
                        return;
                    }
                    tableBody.innerHTML = schedules.map(s => `
                        <tr>
                            <td class="fw-bold">${s.name}</td>
                            <td><code>${s.cron_expression}</code></td>
                            <td class="small text-muted">${s.last_run ? new Date(s.last_run).toLocaleString() : 'Nunca'}</td>
                            <td><span class="badge ${s.is_active ? 'bg-success' : 'bg-secondary'}">${s.is_active ? 'Activa' : 'Pausada'}</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error(err);
            }
        }
        document.addEventListener('DOMContentLoaded', loadSchedules);
    </script>
</body>
</html>
