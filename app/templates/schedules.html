{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
            <h1 class="h4 mb-0 text-dark fw-bold">⏰ Programación de Tareas</h1>
            <small class="text-muted">Gestiona la frecuencia, hora de ejecución y retención de tus respaldos automáticos</small>
        </div>
        <div>
            <a href="/" class="btn btn-sm btn-outline-secondary fw-bold">
                ⬅️ Volver al Dashboard
            </a>
        </div>
    </div>

    <!-- TARJETAS DE TAREAS PROGRAMADAS -->
    <div class="row id="schedules-list-container">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="small text-muted mt-2">Cargando tareas programadas...</p>
        </div>
    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', loadSchedules);

async function loadSchedules() {
    const container = document.getElementById('schedules-list-container');
    try {
        const response = await fetch('/api/v1/schedules/');
        const data = await response.json();

        if (response.ok && data.schedules) {
            let html = '';
            data.schedules.forEach(task => {
                const isChecked = task.enabled ? 'checked' : '';
                const statusBadge = task.enabled 
                    ? '<span class="badge bg-success">Activa</span>' 
                    : '<span class="badge bg-secondary">Pausada</span>';

                html += `
                    <div class="col-md-6 mb-3">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                                <h6 class="m-0 fw-bold text-dark">${task.name}</h6>
                                ${statusBadge}
                            </div>
                            <div class="card-body">
                                <ul class="list-unstyled small mb-3">
                                    <li class="mb-1"><strong>🎯 Objetivo:</strong> ${task.target_app}</li>
                                    <li class="mb-1"><strong>⚙️ Motor:</strong> ${task.backend.toUpperCase()}</li>
                                    <li class="mb-1"><strong>⏰ Hora de ejecución:</strong> ${task.time} hrs (${task.frequency})</li>
                                    <li class="mb-1"><strong>🗓️ Retención:</strong> ${task.retention_days} días</li>
                                </ul>

                                <div class="form-check form-switch mt-3 pt-2 border-top">
                                    <input class="form-check-input" type="checkbox" id="switch-${task.id}" ${isChecked} onchange="toggleTask('${task.id}')">
                                    <label class="form-check-label small fw-bold" for="switch-${task.id}">
                                        ${task.enabled ? 'Tarea Habilitada' : 'Tarea Pausada'}
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    } catch (err) {
        container.innerHTML = `
            <div class="col-12">
                <div class="alert alert-danger">Error al cargar la lista de tareas programadas.</div>
            </div>
        `;
    }
}

async function toggleTask(taskId) {
    try {
        const response = await fetch(`/api/v1/schedules/toggle/${taskId}`, { method: 'POST' });
        const resData = await response.json();
        if (response.ok) {
            loadSchedules();
        } else {
            alert(resData.message || 'No se pudo cambiar el estado de la tarea.');
        }
    } catch (err) {
        alert('Error de conexión con el servidor.');
    }
}
</script>
{% endblock %}
