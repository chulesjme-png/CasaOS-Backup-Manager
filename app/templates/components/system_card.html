<section class="grid">
    <div class="card">
        <h2>🖥️ Sistema</h2>

        <p>
            <strong>Sistema operativo:</strong>
            {{ engine.operating_system | default(engine.os) }}
        </p>

        <p>
            <strong>Arquitectura:</strong>
            {{ engine.architecture }}
        </p>

        <p>
            <strong>Kernel:</strong>
            {{ engine.kernel_version | default(engine.kernel) }}
        </p>

        <p>
            <strong>CPU:</strong>
            {{ engine.cpus | default(engine.cpu) }}
        </p>

        <p>
            <strong>RAM:</strong>
            {{ engine.memory_gb | default(engine.ram) }} GB
        </p>
    </div>
</section>
