<div class="docker-info-card p-2">
    <div class="d-flex align-items-center mb-2">
        <span class="fs-5 me-2">🐳</span>
        <h6 class="mb-0 fw-bold">Docker Engine</h6>
    </div>

    <ul class="list-group list-group-flush small">
        <li class="list-group-item d-flex justify-content-between px-0 py-1 bg-transparent border-0">
            <span class="text-muted">Estado:</span>
            <span class="fw-semibold text-success">🟢 Activo</span>
        </li>
        <li class="list-group-item d-flex justify-content-between px-0 py-1 bg-transparent border-0">
            <span class="text-muted">Versión API:</span>
            <span class="fw-semibold text-dark">{{ docker.api_version | default('1.43') }}</span>
        </li>
        <li class="list-group-item d-flex justify-content-between px-0 py-1 bg-transparent border-0">
            <span class="text-muted">Contenedores Activos:</span>
            <span class="fw-semibold text-dark">{{ docker.containers_running | default(16) }}</span>
        </li>
    </ul>
</div>
