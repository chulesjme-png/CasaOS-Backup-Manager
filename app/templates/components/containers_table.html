<div class="card shadow-sm border-0 mb-3">
    <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
        <h6 class="m-0 fw-bold text-primary" style="font-size: 0.9rem;">📦 Depuración de Contenedores</h6>
        <span class="badge bg-secondary">Total: {{ containers|length if containers else 0 }}</span>
    </div>
    
    <div class="table-responsive p-3" style="max-height: 360px; overflow-y: auto;">
        <p class="small text-muted mb-2"><strong>Dato bruto que recibe Jinja2 en la variable <code>containers</code>:</strong></p>
        <pre class="bg-dark text-warning p-3 rounded small" style="font-family: monospace;">{{ containers | tojson(indent=2) }}</pre>
    </div>
</div>
