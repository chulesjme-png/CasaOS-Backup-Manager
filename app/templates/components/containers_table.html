<section class="card"><h2>📦 Contenedores Docker</h2><table class="services"><thead><tr><th>Contenedor</th><th>Imagen</th><th>Estado</th></tr></thead><tbody>{% for service in services %}<tr><td>{{ service.name }}</td><td>{{ service.image }}</td><td>{% if service.running %}<span class="ok">🟢 Running</span>{% else %}<span class="error">{{ service.status }}</span>{% endif %}</td></tr>{% endfor %}</tbody></table></section>
