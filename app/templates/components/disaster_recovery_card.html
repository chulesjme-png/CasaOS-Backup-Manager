<div class="card shadow-sm mb-3 border-0 border-start border-4 border-primary">
    <div class="card-body py-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
                <h6 class="m-0 fw-bold text-primary" style="font-size: 0.95rem;">
                    🛡️ Copia de Seguridad del Sistema Completo (Disaster Recovery)
                </h6>
                <small class="text-muted" style="font-size: 0.78rem;">
                    Resguarda la configuración de CasaOS, datos de las apps (`/DATA/AppData`) y bases de datos.
                </small>
            </div>
            <button class="btn btn-primary btn-sm fw-bold px-3 py-1" id="btn-full-system-backup" onclick="triggerFullSystemBackup()">
                💾 Copiar Sistema Completo
            </button>
        </div>
        
        <div class="d-flex align-items-center gap-3 mt-2 pt-2 border-top">
            <div class="d-flex align-items-center gap-1 small text-secondary">
                <span>🔄 Modo:</span>
                <span class="fw-semibold text-dark">Incremental (Duplicati)</span>
            </div>
            <div class="d-flex align-items-center gap-1 small text-secondary">
                <span>🔒 Estado:</span>
                <span id="system-backup-status-badge" class="badge bg-success-subtle text-success border border-success-subtle">
                    Listo para resguardo
                </span>
            </div>
        </div>
    </div>
</div>

<script>
async function triggerFullSystemBackup() {
    const btn = document.getElementById('btn-full-system-backup');
    const badge = document.getElementById('system-backup-status-badge');
    
    if (!btn || !badge) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span> Iniciando...';
    badge.className = 'badge bg-warning-subtle text-warning border border-warning-subtle';
    badge.textContent = 'En ejecución...';

    const selectedTarget = document.getElementById('storage-select')?.value || '/DATA/Backups/CasaOS';

    try {
        const response = await fetch('/api/v1/executions/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                backend_name: 'duplicati',
                backup_id: 'full_system_backup',
                target_path: selectedTarget
            })
        });

        if (response.ok) {
            const data = await response.json();
            badge.className = 'badge bg-info-subtle text-info border border-info-subtle';
            badge.textContent = 'Copia iniciada';
            alert('✅ Copia del sistema completo enviada con éxito a Duplicati.');
        } else {
            const errorData = await response.json().catch(() => ({}));
            console.error('Error server:', response.status, errorData);
            throw new Error(`Servidor devolvió estado ${response.status}`);
        }
    } catch (err) {
        console.error(err);
        badge.className = 'badge bg-danger-subtle text-danger border border-danger-subtle';
        badge.textContent = 'Error al ejecutar';
        alert(`❌ Error al conectar con la API: ${err.message}`);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '💾 Copiar Sistema Completo';
    }
}
</script>
