<script>
document.getElementById('btn-search-backups')?.addEventListener('click', async () => {
    const container = document.getElementById('restore-points-container');
    const appId = document.getElementById('restore-app-select').value;
    const backend = document.getElementById('restore-backend-select').value;
    const targetPath = document.getElementById('restore-target-path').value;

    container.innerHTML = `
        <div class="text-center my-4">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
            <p class="small text-muted mt-2">Consultando snapshots en ${backend.toUpperCase()} (Puerto 8200)...</p>
        </div>
    `;

    try {
        const response = await fetch(`/api/v1/executions/snapshots?backend=${backend}&app_id=${appId}&path=${encodeURIComponent(targetPath)}`);
        const data = await response.json();

        if (response.ok && data.snapshots && data.snapshots.length > 0) {
            let html = '<div class="list-group list-group-flush">';
            data.snapshots.forEach(snap => {
                html += `
                    <div class="list-group-item d-flex justify-content-between align-items-center py-2 px-0 border-bottom">
                        <div>
                            <strong class="text-dark">${snap.time}</strong><br>
                            <small class="text-muted">Versión / ID: ${snap.version}</small>
                        </div>
                        <button class="btn btn-sm btn-outline-success fw-bold" onclick="startRestore('${appId}', '${snap.version}')">
                            ⚡ Restaurar
                        </button>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }
    } catch (err) {
        container.innerHTML = `<div class="alert alert-danger small">No se pudo conectar con el motor de Duplicati.</div>`;
    }
});

async function startRestore(appId, version) {
    if (!confirm(`¿Confirmas la restauración de '${appId}' (Versión: ${version})?`)) return;

    try {
        const response = await fetch('/api/v1/executions/restore', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                backend_name: document.getElementById('restore-backend-select').value,
                application: appId,
                version: version,
                target_path: document.getElementById('restore-target-path').value
            })
        });
        const resData = await response.json();
        alert(`✅ ${resData.message}`);
    } catch (err) {
        alert(`⚡ Proceso enviado a Duplicati.`);
    }
}
</script>
