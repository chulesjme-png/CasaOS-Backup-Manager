<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restauración de Copias - CasaOS Backup Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- ENCABEZADO -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-rotate-left text-amber-600"></i> Centro de Restauración
                </h1>
                <p class="text-slate-500 text-sm mt-1">Recupera archivos, bases de datos o el sistema completo desde tus respaldos guardados.</p>
            </div>
            <div>
                <a href="/" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Volver al Dashboard
                </a>
            </div>
        </div>

        <!-- LISTA DE SNAPSHOTS -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Copias de Seguridad Disponibles en Disco</h2>
            <div id="snapshots-list" class="space-y-4">
                <div class="p-4 bg-slate-50 text-slate-600 border border-slate-200 rounded-lg text-center text-sm">
                    Escanear respuestas del almacenamiento...
                </div>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        const APP_NAMES_MAP = {
            'system_disaster_recovery': 'Copia del Sistema Completo (Disaster Recovery)',
            'immich-postgres': 'Immich (Base de Datos PostgreSQL)',
            'nextcloud': 'Nextcloud',
            'navidrome': 'Navidrome',
            'plex': 'Plex Media Server'
        };

        function getFriendlyAppName(rawName) {
            return APP_NAMES_MAP[rawName] || rawName;
        }

        async function loadSnapshots() {
            try {
                const res = await fetch('/api/v1/restore/snapshots');
                const data = await res.json();
                const container = document.getElementById('snapshots-list');

                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="p-4 bg-amber-50 text-amber-800 border border-amber-200 rounded-lg text-center text-sm">
                            No se encontraron archivos de respaldo disponibles en la ruta de almacenamiento configurada.
                        </div>`;
                    return;
                }

                container.innerHTML = data.map(item => `
                    <div class="flex items-center justify-between p-4 border border-slate-200 rounded-lg hover:bg-slate-50 transition">
                        <div>
                            <span class="font-bold text-slate-800 text-base">${getFriendlyAppName(item.app_name)}</span>
                            <div class="text-xs text-slate-500 font-mono mt-1">
                                Archivo: <span class="bg-slate-200 px-1.5 py-0.5 rounded">${item.id}</span> | Tamaño: ${item.file_size}
                            </div>
                        </div>
                        <div>
                            <button onclick="triggerRestore('${item.id}', '${item.app_name}')" class="bg-amber-600 hover:bg-amber-700 text-white font-medium px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
                                <i class="fa-solid fa-rotate-left"></i> Restaurar
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Error cargando snapshots:", err);
            }
        }

        async function triggerRestore(snapshotId, appName) {
            if (confirm(`⚠️ ¡Atención! Estás a punto de restaurar "${getFriendlyAppName(appName)}". Esta acción puede sobrescribir los datos actuales. ¿Deseas continuar?`)) {
                const res = await fetch('/api/v1/restore/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ snapshot_id: snapshotId, app_name: appName })
                });

                if (res.ok) {
                    alert("Proceso de restauración iniciado con éxito.");
                } else {
                    alert("Error al solicitar la restauración.");
                }
            }
        }

        document.addEventListener('DOMContentLoaded', loadSnapshots);
    </script>
</body>
</html>
