<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CasaOS Backup Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🚀 CasaOS Backup Manager</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                <a class="nav-link" href="/schedules"><i class="bi bi-calendar-check me-1"></i> Programaciones</a>
                <a class="nav-link" href="/restore"><i class="bi bi-arrow-counterclockwise me-1"></i> Restauración</a>
                <a class="nav-link" href="/docs" target="_blank"><i class="bi bi-code-slash me-1"></i> API Docs</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Tarjetas de Estado General -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 border-start border-4 border-primary">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="flex-grow-1">
                                <h6 class="text-muted fw-normal mb-1">Destinos Configurados</h6>
                                <h3 class="mb-0 fw-bold" id="total-backends">0</h3>
                            </div>
                            <div class="fs-1 text-primary"><i class="bi bi-hdd-network"></i></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-0 border-start border-4 border-success">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="flex-grow-1">
                                <h6 class="text-muted fw-normal mb-1">Tareas Programadas</h6>
                                <h3 class="mb-0 fw-bold" id="total-schedules">0</h3>
                            </div>
                            <div class="fs-1 text-success"><i class="bi bi-clock-history"></i></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-0 border-start border-4 border-info">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="flex-grow-1">
                                <h6 class="text-muted fw-normal mb-1">Estado del Programador</h6>
                                <h3 class="mb-0 fw-bold fs-5 text-success"><i class="bi bi-check-circle-fill me-1"></i> Activo</h3>
                            </div>
                            <div class="fs-1 text-info"><i class="bi bi-cpu"></i></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sección Principal -->
        <div class="row g-4">
            <!-- Historial de Respaldos -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 fw-bold"><i class="bi bi-list-task me-2 text-primary"></i>Últimas Ejecuciones</h5>
                        <button class="btn btn-sm btn-outline-secondary" onclick="loadDashboardData()"><i class="bi bi-arrow-clockwise me-1"></i>Actualizar</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Origen</th>
                                    <th>Estado</th>
                                    <th>Fecha</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="executions-table">
                                <tr>
                                    <td colspan="5" class="text-center py-4 text-muted">Cargando ejecuciones...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Acciones Rápidas -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0 fw-bold"><i class="bi bi-lightning-charge me-2 text-warning"></i>Acciones Rápidas</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button class="btn btn-primary text-start p-3" onclick="triggerManualBackup()">
                                <i class="bi bi-play-circle-fill me-2 fs-5"></i>
                                <strong>Ejecutar Respaldo Manual</strong>
                                <div class="small opacity-75">Inicia una copia de seguridad inmediata</div>
                            </button>
                            <a href="/schedules" class="btn btn-outline-secondary text-start p-3">
                                <i class="bi bi-calendar-plus me-2 fs-5"></i>
                                <strong>Nueva Programación</strong>
                                <div class="small text-muted">Configura una tarea automatizada</div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadDashboardData() {
            try {
                // Cargar Backends
                const resBackends = await fetch('/api/backends/');
                if (resBackends.ok) {
                    const backends = await resBackends.json();
                    document.getElementById('total-backends').innerText = backends.length;
                }

                // Cargar Programaciones
                const resSchedules = await fetch('/api/schedules/');
                if (resSchedules.ok) {
                    const schedules = await resSchedules.json();
                    document.getElementById('total-schedules').innerText = schedules.length;
                }

                // Cargar Ejecuciones
                const resExecs = await fetch('/api/executions/');
                const tableBody = document.getElementById('executions-table');
                
                if (resExecs.ok) {
                    const execs = await resExecs.json();
                    if (!execs || execs.length === 0) {
                        tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No hay registros de ejecuciones aún.</td></tr>`;
                        return;
                    }

                    tableBody.innerHTML = execs.slice(0, 5).map(e => `
                        <tr>
                            <td>#${e.id}</td>
                            <td><span class="fw-semibold">${e.source_path || 'Sistema'}</span></td>
                            <td>
                                <span class="badge ${e.status === 'COMPLETED' ? 'bg-success' : e.status === 'RUNNING' ? 'bg-warning text-dark' : 'bg-danger'}">
                                    ${e.status}
                                </span>
                            </td>
                            <td class="small text-muted">${new Date(e.created_at).toLocaleString()}</td>
                            <td><a href="/restore" class="btn btn-sm btn-light border"><i class="bi bi-eye"></i></a></td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error('Error cargando datos del dashboard:', err);
            }
        }

        async function triggerManualBackup() {
            if (!confirm("¿Deseas iniciar una copia de seguridad manual en este momento?")) return;
            try {
                const res = await fetch('/api/executions/run-manual', { method: 'POST' });
                if (res.ok) {
                    alert("✅ Respaldo iniciado correctamente.");
                    loadDashboardData();
                } else {
                    alert("⚠️ No se pudo iniciar la tarea.");
                }
            } catch (e) {
                alert("❌ Error de conexión al servidor.");
            }
        }

        document.addEventListener('DOMContentLoaded', loadDashboardData);
    </script>
</body>
</html>
