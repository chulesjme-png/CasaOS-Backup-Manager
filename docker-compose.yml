services:
  casaos-backup-manager:
    build: .
    container_name: casaos-backup-manager
    restart: unless-stopped
    privileged: true
    ports:
      - "8088:8088"
    volumes:
      # Acceso al host para inspección de discos e información real
      - /:/host:ro
      - /dev:/dev:ro
      - /run/udev:/run/udev:ro
      # Acceso al socket de Docker para ejecutar DB Hooks
      - /var/run/docker.sock:/var/run/docker.sock
      # Acceso a los datos y configuración de CasaOS
      - /DATA:/DATA
      - /etc/casaos:/etc/casaos:ro
      - /var/lib/casaos:/var/lib/casaos:ro
      # Unidades y discos externos de backup
      - /media:/media:rshared
      - /mnt:/mnt:rshared
      - /run/media:/run/media:rshared
      # Persistencia de la caché e índices de BorgBackup
      - borg_cache:/root/.cache/borg
    environment:
      - TZ=Europe/Madrid
      - PYTHONUNBUFFERED=1
      - DATA_PATH=${DATA_PATH:-/DATA}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Automatización no interactiva de BorgBackup
      - BORG_UNKNOWN_UNENCRYPTED_REPO_ACCESS_IS_OK=yes
      - BORG_RELOCATED_REPO_ACCESS_IS_OK=yes
      - BORG_UNKNOWN_CLI_OPTION_IS_OK=yes

volumes:
  borg_cache: