services:
  casaos-backup-manager:
    build: .
    image: casaos-backup-manager:latest
    container_name: casaos-backup-manager
    restart: unless-stopped
    privileged: true
    ports:
      - "8088:8088"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8088"]
    volumes:
      # Acceso al host y dispositivos
      - /:/host:ro
      - /dev:/dev:ro
      - /run/udev:/run/udev:ro
      # Socket y cliente de Docker
      - /usr/bin/docker:/usr/bin/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Control de servicios del sistema
      - /bin/systemctl:/bin/systemctl:ro
      - /usr/bin/systemctl:/usr/bin/systemctl:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      # Rutas de datos y configuración de CasaOS
      - /DATA:/DATA
      - /etc/casaos:/etc/casaos
      - /var/lib/casaos:/var/lib/casaos
      # Almacenamiento externo y discos
      - /media:/media:rshared
      - /mnt:/mnt:rshared
      # Caché persistente para BorgBackup
      - borg_cache:/root/.cache/borg
    environment:
      - TZ=Europe/Madrid
      - PYTHONUNBUFFERED=1
      - DATA_PATH=${DATA_PATH:-/DATA}
      - BORG_UNKNOWN_UNENCRYPTED_REPO_ACCESS_IS_OK=yes
      - BORG_RELOCATED_REPO_ACCESS_IS_OK=yes
      - BORG_UNKNOWN_CLI_OPTION_IS_OK=yes
    labels:
      icon: "http://192.168.1.10:8088/static/img/logo-icon.svg"
    x-casaos:
      architectures:
        - amd64
        - arm64
      main: casaos-backup-manager
      title:
        custom: CasaOS Backup Manager
      icon: "http://192.168.1.10:8088/static/img/logo-icon.svg"
      port_map: "8088"
      scheme: "http"
      index: "/"
      show_in_launcher: true

volumes:
  borg_cache:
