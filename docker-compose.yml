services:
  casaos-backup-manager:
    container_name: casaos-backup-manager

    build:
      context: .

    image: casaos-backup-manager:latest

    ports:
      - "8088:8000"

    environment:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data

    restart: unless-stopped