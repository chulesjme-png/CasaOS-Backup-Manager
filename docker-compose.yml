services:
  casaos-backup-manager:
    build: .
    image: casaos-backup-manager:latest
    container_name: casaos-backup-manager
    restart: unless-stopped
    privileged: true
    ports:
      - "8088:8088"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8088"]
    volumes:
      # Acceso al host para inspección de discos e información real
      - /:/host:ro
      - /dev:/dev:ro
      - /run/udev:/run/udev:ro
      # Acceso al cliente y socket de Docker
      - /usr/bin/docker:/usr/bin/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Acceso a systemctl y D-Bus para gestionar servicios de CasaOS en el Host
      - /bin/systemctl:/bin/systemctl:ro
      - /usr/bin/systemctl:/usr/bin/systemctl:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      # Acceso a los datos y configuración de CasaOS
      - /DATA:/DATA
      - /etc/casaos:/etc/casaos
      - /var/lib/casaos:/var/lib/casaos
      # Unidades y discos externos de backup
      - /media:/media:rshared
      - /mnt:/mnt:rshared
      - /run/media:/run/media:rshared
      # Persistencia de la caché e índices de BorgBackup
      - borg_cache:/root/.cache/borg
    environment:
      - TZ=Europe/Madrid
      - PYTHONUNBUFFERED=1
      - DATA_PATH=${DATA_PATH:-/DATA}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Automatización no interactiva de BorgBackup
      - BORG_UNKNOWN_UNENCRYPTED_REPO_ACCESS_IS_OK=yes
      - BORG_RELOCATED_REPO_ACCESS_IS_OK=yes
      - BORG_UNKNOWN_CLI_OPTION_IS_OK=yes
    labels:
      icon: "http://192.168.1.10:8088/static/img/logo-icon.svg"
    x-casaos:
      architectures:
        - amd64
        - arm64
      main: casaos-backup-manager
      title:
        custom: CasaOS Backup Manager
      icon: "http://192.168.1.10:8088/static/img/logo-icon.svg"
      port_map: "8088"
      scheme: "http"
      index: "/"
      show_in_launcher: true

volumes:
  borg_cache: