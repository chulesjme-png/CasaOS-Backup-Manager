services:
  casaos-backup-manager:
    container_name: casaos-backup-manager
    build:
      context: .
    image: casaos-backup-manager:latest

    ports:
      - "8088:8000"

    environment:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys

    volumes:
      # Código montado para cambios rápidos
      - .:/app
      # Socket de Docker para listar todos los contenedores reales
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Telemetría de Kernel y Hardware
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Raíz del sistema e información de datos/apps de CasaOS
      - /:/host_root:ro
      - /DATA:/DATA:rw
      - /var/lib/casaos:/var/lib/casaos:ro
      - /mnt:/mnt:ro
      # Persistencia de datos del Backup Manager
      - ./data:/data

    restart: unless-stopped