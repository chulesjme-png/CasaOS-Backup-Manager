version: '3.8'

services:
  casaos-backup-manager:
    build: .
    container_name: casaos-backup-manager
    restart: unless-stopped
    privileged: true
    ports:
      - "8088:8088"
    volumes:
      # Acceso al host para inspección de discos e información real
      - /:/host:ro
      - /dev:/dev:ro
      - /run/udev:/run/udev:ro
      # Acceso al socket de Docker para ejecutar DB Hooks
      - /var/run/docker.sock:/var/run/docker.sock
      # Acceso a los datos y configuración de CasaOS
      - /DATA:/DATA
      - /etc/casaos:/etc/casaos:ro
      - /var/lib/casaos:/var/lib/casaos:ro
      # Unidades y discos externos de backup
      - /media:/media:rshared
      - /mnt:/mnt:rshared
      - /run/media:/run/media:rshared
    environment:
      - TZ=Europe/Madrid
      - PYTHONUNBUFFERED=1