services:
  casaos-backup-manager:
    container_name: casaos-backup-manager
    build:
      context: .
    image: casaos-backup-manager:latest

    ports:
      - "8088:8000"

    environment:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys

    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host_root:ro
      # Lectura de orígenes de datos de CasaOS
      - /DATA:/DATA:ro
      - /var/lib/casaos:/var/lib/casaos:ro
      # Acceso completo de lectura/escritura a todos los discos externos
      - /media:/media:rw
      - /mnt:/mnt:rw
      # Persistencia de configuración interna del gestor
      - ./data:/data

    restart: unless-stopped