version: '3.8'

services:
  casaos-backup-manager:
    build: .
    container_name: casaos-backup-manager
    restart: unless-stopped
    privileged: true
    ports:
      - "8088:8088"
    volumes:
      # Acceso al socket de Docker para ejecutar DB Hooks en contenedores de apps
      - /var/run/docker.sock:/var/run/docker.sock
      # Acceso a los datos de aplicaciones de CasaOS
      - /DATA:/DATA
      # Acceso a la configuración y base de datos del sistema CasaOS
      - /etc/casaos:/etc/casaos:ro
      - /var/lib/casaos:/var/lib/casaos:ro
      # Acceso dinámico a unidades y discos externos de backup (con propagación de montajes)
      - /media:/media:rshared
      - /mnt:/mnt:rshared
      - /run/media:/run/media:rshared
    environment:
      - TZ=Europe/Madrid
      - PYTHONUNBUFFERED=1