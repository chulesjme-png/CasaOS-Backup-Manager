version: '3.8'

services:
  casaos-backup-manager:
    build: .
    container_name: casaos-backup-manager
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      # Acceso al socket de Docker para ejecutar DB Hooks en contenedores de apps
      - /var/run/docker.sock:/var/run/docker.sock
      # Acceso a los datos de aplicaciones de CasaOS
      - /DATA:/DATA
      # Acceso a unidades y discos externos de backup
      - /media:/media
      - /mnt:/mnt
    environment:
      - TZ=Europe/Madrid
      - PYTHONUNBUFFERED=1